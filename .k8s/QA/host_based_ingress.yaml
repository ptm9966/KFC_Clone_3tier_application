apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kfc-ingress
  namespace: kfc-qa
  annotations:
    # Enable SSL redirect
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # This annotation triggers cert-manager to automatically create a certificate
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - bikkam.online
      secretName: kfc-tls
  rules:
  - host: bikkam.online  # Change this to your domain
    http:
      paths:
      # Backend API routes (more specific paths first)
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8080
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8080
      - path: /api-docs
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8080
      # Frontend React SPA (catch-all - must be last)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
