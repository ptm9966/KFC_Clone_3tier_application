apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: kfc-dev-deployment

# Namespace for all resources
namespace: dev

# Common labels applied to all resources
commonLabels:
  app: kfc-clone
  environment: development

# Resources to include
resources:
  - mongodb_storage_class.yml
  - mongodb_data_configmap.yaml
  - mongodb-deployment.yaml
  - backend_configmap.yaml
  - backend-deployment.yaml
  - frontend-deployment.yaml

# Image transformations
images:
  - name: kfc-backend
    newTag: latest
  - name: kfc-frontend
    newTag: latest

# ConfigMap generator for additional configuration
configMapGenerator:
  - name: app-config
    literals:
      - ENVIRONMENT=development
      - LOG_LEVEL=debug

# Replica count modifications
replicas:
  - name: kfc-backend
    count: 2
  - name: kfc-frontend
    count: 2
  - name: kfc-mongodb
    count: 1

# Resource limits and requests
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kfc-backend
        namespace: dev
      spec:
        template:
          spec:
            containers:
            - name: backend
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "250m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
    target:
      kind: Deployment
      name: kfc-backend
      namespace: dev
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kfc-frontend
        namespace: dev
      spec:
        template:
          spec:
            containers:
            - name: frontend
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
    target:
      kind: Deployment
      name: kfc-frontend
      namespace: dev